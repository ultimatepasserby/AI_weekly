name: Monthly AI Poster

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一凌晨3点运行
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate poster
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_poster.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add final_poster.png background.png index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto poster $(date +'%Y-%m')"
          git push
